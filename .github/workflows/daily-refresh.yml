name: Refresh and publish Culture Signal
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: culture-signal-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Read fresh RSS and charts
        run: python scripts/update.py
      - name: Save the latest feed
        run: |
          git config user.name "culture-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json data/seed.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh culture feed"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
